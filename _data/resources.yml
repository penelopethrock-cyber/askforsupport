lgbtqia2s:
  - name: The Lesbian, Gay, Bisexual & Transgender Community Center
    description: "Advocacy, health & wellness programs, arts/cultural events, 12-step recovery support, and family support services for the LGBTQ+ community."
    address: "208 West 13th Street, New York, NY 10011"
    link: "https://gaycenter.org"
  - name: Ali Forney Center
    description: "Shelter, drop-in services, and case management for LGBTQ+ homeless youth."
    phone: "(212) 206-0574"
    address: "307 West 38th Street, 3rd Floor, New York, NY 10018"
    hours: "Mon-Fri 8am-8pm, Sat-Sun 10am-6pm"
    link: "https://aliforneycenter.org"

healthcare:
  - name: NYC Care
    description: "Low-cost/no-cost health services for New Yorkers without health insurance, via NYC Health + Hospitals. Choose your own doctor."
    phone: "1-646-NYC-CARE (1-646-692-2273)"
    address: "Citywide, via NYC Health + Hospitals"
    link: "https://nyccare.nyc"
  - name: "Institute for Family Health - ECHO Free Clinic"
    description: "Free confidential health care for uninsured adults, open Saturday mornings."
    phone: "(347) 854-0170"
    address: "Walton Family Health Center, 1894 Walton Avenue, Bronx, NY 10453"
    link: "https://institute.org"

education:
  - name: Brooklyn College Adult Literacy Program (BCALP)
    description: "Free GED/HSE prep and ESOL classes for NY residents 18+, with case management."
    address: "Brooklyn College, Brooklyn, NY"
    link: "https://brooklyn.edu/literacy"
  - name: CCNY Free GED Preparation Program
    description: "Free GED/HSE prep classes for NY residents 19+."
    address: "City College of New York, 160 Convent Avenue, New York, NY 10031"
    link: "https://ccny.cuny.edu/cps/ged"
  - name: "ACCES-VR (Adult Career and Continuing Education Services - Vocational Rehabilitation)"
    description: "A New York State Education Department program that helps people with disabilities achieve and maintain employment and support independent living. A Vocational Rehabilitation Counselor helps develop an individualized plan and can provide services like job training, education support, assistive technology, and job placement. Eligibility-based, not automatic entitlement."
    phone: "1-800-222-JOBS (5627)"
    link: "https://www.acces.nysed.gov/vr"
    apply_link: "https://www.acces.nysed.gov/vr/applying-vocational-rehabilitation-services"
  - name: Blueprint Supported Education
    description: "A NYC-based program (via Community Access) providing free, one-on-one support to adults 18+ living in NYC who have a history of mental health conditions and want to pursue high school equivalency, post-secondary degrees, or vocational certification. Focuses on education as a core part of mental health recovery and wellness, includes project-based learning and college/career readiness support."
    link: "https://www.blueprintsed.org"
    reference_link: "https://www.communityaccess.org/our-work/supported-education/blueprint-supported-education"

technology:
  - name: NYPL TechConnect
    description: "Free computer classes, digital literacy, Microsoft Office training, and one-on-one tech help at New York Public Library branches."
    address: "Multiple branches; flagship: Stavros Niarchos Foundation Library, 455 Fifth Avenue, New York, NY 10016"
    link: "https://nypl.org/techconnect"
  - name: NYC Free Computer Centers (NYC Office of Technology and Innovation)
    description: "Basic computer classes, tech help, job/resume help, device borrowing, and printing at multiple locations citywide."
    phone: "(212) 714-8400"
    address: "Multiple locations, e.g. NYPL 53rd Street Library, 18 West 53rd Street, New York, NY 10019"
    link: "https://nyc.gov/content/oti/pages/free-computer-centers"

opwdd:
  - name: Care Design NY
    description: "Provides comprehensive Health Home care management and Medicaid Service Coordination (MSC) for people with I/DD enrolled in OPWDD services. Serves all 5 NYC boroughs."
    phone: "(518) 235-1888"
    link: "https://caredesignny.org"
  - name: Tri-County Care
    description: "A New York CCO providing Health Home care management and MSC for people with I/DD enrolled in OPWDD services, with offices in Brooklyn, Long Island City, and other locations."
    phone: "844-504-8400"
    link: "https://tricountycare.org"
    note: "As of mid-2026, OPWDD reports Tri-County Care has paused new enrollments. Contact OPWDD or another CCO if enrolling for the first time."
  - name: Advance Care Alliance of NY (ACA-NY)
    description: "A nonprofit CCO providing Health Home care management and MSC for people with I/DD enrolled in OPWDD services across all 5 NYC boroughs. Customer service available 24 hours a day."
    phone: "1-833-692-2269 (24/7 Customer Service)"
    link: "https://acany.org"
  - name: "OPWDD Front Door – How to Access Services"
    description: "The standard entry process for OPWDD services in NY: (1) Contact the Front Door/OPWDD Infoline or a Care Manager; (2) Complete eligibility determination (documentation of I/DD); (3) Enroll in a Care Coordination Organization; (4) Develop a Life Plan; (5) Access services through your plan."
    phone: "OPWDD Infoline: 1-866-946-9733"
    link: "https://opwdd.ny.gov/get-started/front-door"
disability_services:
  - name: OPWDD Self-Direction
    description: "New York State's self-direction program lets individuals with developmental disabilities design their own support services and hire their own workers, with a Medicaid Service Coordinator (MSC) or Support Broker to help manage the budget."
    phone: "1-866-946-9733"
    address: "Statewide; NYC regional office: 25 Beaver Street, New York, NY 10004"
    link: "https://opwdd.ny.gov/self-direction"
  - name: OPWDD Front Door
    description: "The Front Door is OPWDD's person-centered process for establishing eligibility and access to services for people who are new to OPWDD or seeking to modify existing services. Steps: (1) Call the OPWDD Infoline and ask to be transferred to your local Front Door office by county. (2) Attend a Front Door information session to learn about eligibility and services. (3) Submit a complete eligibility packet (medical, psychological, and educational evaluations documenting a qualifying developmental disability, such as autism, intellectual disability, or Down syndrome, plus 3+ adaptive scores in the low range). (4) Complete a DDP-2 phone interview, usually about a week after the Front Door session. (5) Receive an eligibility determination letter, typically within 2-4 weeks. (6) Once eligible, choose a Care Coordination Organization (CCO) and enroll with a Care Manager to build a person-centered Life Plan. The whole process usually takes 3-6 months."
    phone: "1-866-946-9733"
    address: "Regional Front Door offices by county; NYC Developmental Disabilities Regional Office (DDRO), 25 Beaver Street, 4th Floor, New York, NY 10004"
    link: "https://opwdd.ny.gov/get-started/front-door"
  - name: Care Design NY
    description: "One of the three Care Coordination Organizations (CCOs) serving all five NYC boroughs. Provides Health Home Care Management, combining developmental disability services with health and wellness coordination for people with I/DD."
    phone: "518-235-1888"
    address: "Serves all 5 boroughs; borough enrollment specialists available (Bronx, Brooklyn, Queens, Manhattan, Staten Island)"
    link: "https://caredesignny.org"
  - name: Tri-County Care
    description: "One of the three Care Coordination Organizations (CCOs) serving all five NYC boroughs, including Brooklyn, Queens, Staten Island, Bronx, and Manhattan. Provides Health Home Care Management for people with I/DD."
    phone: "1-844-504-8400"
    address: "Serves all 5 boroughs; NYC offices in Brooklyn and Long Island City"
    link: "https://tricountycare.org"
  - name: Advance Care Alliance (ACA/NY)
    description: "One of the three Care Coordination Organizations (CCOs) serving all five NYC boroughs. Provides Health Home Care Management, Comprehensive Care Management, and Person and Family Support for people with I/DD."
    phone: "1-833-692-2269"
    address: "Regional offices in Manhattan (263 West 38th Street) and Staten Island (260 Christopher Lane), serving all 5 boroughs"
    link: "https://acany.org"
