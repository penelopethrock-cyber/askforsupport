opwdd:
  - name: Care Design NY
    description: "Provides comprehensive Health Home care management and Medicaid Service Coordination (MSC) for people with I/DD enrolled in OPWDD services. Serves all 5 NYC boroughs."
    phone: "(518) 235-1888"
    link: "https://caredesignny.org"
  - name: Tri-County Care
    description: "A New York CCO providing Health Home care management and MSC for people with I/DD enrolled in OPWDD services, with offices in Brooklyn, Long Island City, and other locations."
    phone: "844-504-8400"
    link: "https://tricountycare.org"
    note: "As of mid-2026, OPWDD reports Tri-County Care has paused new enrollments. Contact OPWDD or another CCO if enrolling for the first time."
  - name: Advance Care Alliance of NY (ACA-NY)
    description: "A nonprofit CCO providing Health Home care management and MSC for people with I/DD enrolled in OPWDD services across all 5 NYC boroughs. Customer service available 24 hours a day."
    phone: "1-833-692-2269 (24/7 Customer Service)"
    link: "https://acany.org"
  - name: "OPWDD Front Door â How to Access Services"
    description: "The standard entry process for OPWDD services in NY: (1) Contact the Front Door/OPWDD Infoline or a Care Manager; (2) Complete eligibility determination (documentation of I/DD); (3) Enroll in a Care Coordination Organization; (4) Develop a Life Plan; (5) Access services through your plan."
    phone: "OPWDD Infoline: 1-866-946-9733"
    link: "https://opwdd.ny.gov/get-started/front-door"
