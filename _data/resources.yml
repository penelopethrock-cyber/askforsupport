  - name: WE NYC (Women Entrepreneurs NYC)
    type: "Entrepreneurship"
    description: "Free business training, mentorship, and networking for women entrepreneurs in NYC."
    link: "https://we.nyc"

technology:
  - name: NYPL TechConnect
    type: "Digital Literacy"
    description: "Free computer classes, digital literacy, Microsoft Office training, and one-on-one tech help at New York Public Library branches citywide."
    address: "Multiple branches; flagship: 455 Fifth Avenue, New York, NY 10016"
    link: "https://nypl.org/techconnect"
  - name: NYC Free Computer Centers
    type: "Free Computer Centers"
    description: "Basic computer classes, tech help, job/resume help, device borrowing, and printing at multiple locations citywide."
    phone: "212-714-8400"
    link: "https://www.nyc.gov/site/oti/residents/computer-centers.page"
  - name: CyPurr Collective
    type: "Digital Security Workshop"
    description: "A Brooklyn-based collective offering free digital security and privacy workshops (cryptoparties) to help community members protect themselves online."
    address: "Brooklyn, NY"
    link: "https://cypurr.nyc"
  - name: NYC CryptoParty
    type: "Digital Security Workshop"
    description: "Local NYC chapter of the global CryptoParty movement, hosting free hands-on sessions on encryption, privacy tools, and safe digital practices."
    link: "https://www.cryptoparty.in/nyc"
  - name: Tech Learning Collective
    type: "Digital Security Training"
    description: "A worker-owned NYC cooperative offering hands-on courses in digital security, privacy, and networking, including community-oriented and sliding-scale options."
    address: "New York, NY"
    link: "https://www.techlearningcollective.com"
  - name: F-Droid
    type: "App Store"
    description: "Free and open-source app store for Android, hosting only free/open-source apps and flagging trackers, ads, or proprietary dependencies so you know exactly what you're installing."
    link: "https://f-droid.org"
  - name: Briar
    type: "Secure Messaging"
    description: "Encrypted messaging app that syncs directly between devices with no central server, works over Bluetooth, Wi-Fi, or Tor, and keeps working even without internet access."
    link: "https://briarproject.org"
  - name: IPFS (InterPlanetary File System)
    type: "Decentralized Storage"
    description: "Open-source protocol for content-addressed, peer-to-peer file storage and sharing, building a more resilient and censorship-resistant web."
    link: "https://ipfs.tech"
  - name: Nostr
    type: "Decentralized Protocol"
    description: "Open, censorship-resistant protocol for social networking where no single company or server controls your identity, followers, or content."
    link: "https://nostr.org"
  - name: Tor Browser
    type: "Privacy Browser"
    description: "Free browser from the nonprofit Tor Project that protects against tracking, surveillance, and censorship by routing your traffic through multiple encrypted relays."
    link: "https://www.torproject.org"
  - name: Homebrew
    type: "Package Manager (macOS)"
    description: "The most popular free, open-source package manager for macOS, letting you install and manage command-line tools and apps from the Terminal."
    link: "https://brew.sh"
  - name: Scoop
    type: "Package Manager (Windows)"
    description: "Free command-line installer for Windows that installs apps into your user folder without needing admin permissions."
    link: "https://scoop.sh"
  - name: Windows Subsystem for Linux (WSL)
    type: "Dev Tool"
    description: "Free, open-source Microsoft feature that lets you run a real Linux environment directly on Windows, no virtual machine or dual-boot required."
    link: "https://learn.microsoft.com/en-us/windows/wsl/about"
  - name: Chocolatey
    type: "Package Manager (Windows)"
    description: "Free, open-source command-line package manager for Windows that automates software installs, updates, and uninstalls."
    link: "https://chocolatey.org"
  - name: Open-Shell
    type: "Windows Customization"
    description: "Free, open-source tool that restores a classic-style Start menu and other familiar Windows features on Windows 7 through 11."
    link: "https://github.com/Open-Shell/Open-Shell-Menu"
  - name: Microsoft PowerToys
    type: "Windows Utilities"
    description: "Official free, open-source set of utilities from Microsoft for power users, including window management, batch file renaming, keyboard remapping, and more."
    link: "https://learn.microsoft.com/en-us/windows/powertoys"
  - name: Chris Titus Tech's WinUtil
    type: "Windows Utility"
    description: "Free, open-source PowerShell utility that streamlines installing apps, debloating Windows, applying tweaks, and fixing update issues from one tool."
    link: "https://github.com/ChrisTitusTech/winutil"
  - name: UniGetUI
    type: "Package Manager GUI"
    description: "Free, open-source graphical interface (formerly WingetUI) that unifies Winget, Scoop, Chocolatey, and other package managers into one easy app for installing and updating software on Windows."
    link: "https://github.com/Devolutions/UniGetUI"
  - name: Waterfox
    type: "Privacy Browser"
    description: "Free, open-source web browser forked from Firefox, built for speed and privacy while keeping support for legacy extensions."
    link: "https://www.waterfox.com"
  - name: LibreWolf
    type: "Privacy Browser"
    description: "Free, open-source Firefox fork focused on privacy and security, stripping out telemetry and data collection by default."
    link: "https://librewolf.net"
  - name: Brave Browser
    type: "Privacy Browser"
    description: "Free, Chromium-based browser with built-in ad and tracker blocking, aimed at faster and more private browsing by default."
    link: "https://brave.com"
  - name: Chromium
    type: "Open-Source Browser"
    description: "The free, open-source browser project from Google that Chrome and several other browsers are built on, available for developers and privacy-minded users who want the base browser without Google's added services."
    link: "https://www.chromium.org"
  - name: NY Courts Uncontested Divorce DIY Program
    type: "Legal Self-Help"
    description: "Official, free New York State Courts program (via LawHelp Interactive) that walks you through generating your own uncontested divorce paperwork online, no lawyer required if you meet the eligibility requirements (married 6+ months separated, no kids under 21, no contested property)."
    link: "https://www.nycourts.gov/help/diy-forms/uncontested-divorce-program"

housing:
  - name: NYC Housing Connect
    type: "City Program"
    description: "NYC's official portal for applying to affordable housing lotteries across the five boroughs, run by HPD. Create a profile once and apply to multiple listings as they open."
    link: "https://www.nyc.gov/site/hpd/services-and-information/housing-connect.page"
  - name: "Met Council on Housing – Tenants' Rights Hotline"
    type: "Tenant Advocacy"
    description: "Free tenant advocacy hotline open to any tenant living in NYC. Volunteer-staffed, answers questions on repairs, harassment, rent stabilization, evictions, and connects tenants to organizing support and legal referrals."
    phone: "212-979-0611"
    link: "https://www.metcouncilonhousing.org"
  - name: NYC Tenant Helpline (via 311)
    type: "City Program"
    description: "A one-stop city service to inform NYC tenants about their rights and connect them to housing-related resources, including free legal services. Reach it through 311."
    phone: "311"
  - name: HRA Homebase
    type: "Homelessness Prevention"
    description: "NYC's homelessness prevention program, offering case management, help resolving rent arrears, mediation with landlords, and connections to emergency financial assistance to help households stay housed or find new housing before entering shelter."
    phone: "212-361-8000"
    link: "https://www.nyc.gov/site/hra/help/homebase.page"
  - name: Disability Rent Increase Exemption (DRIE)
    type: "Disability Housing Benefit"
    description: "A NYC program that freezes the rent for eligible low-income tenants with disabilities in rent-regulated apartments, exempting them from future rent increases. The landlord receives a property tax credit to offset the frozen rent."
    link: "https://www.nyc.gov/site/rentfreeze/index.page"
  - name: Section 811 Supportive Housing for Persons with Disabilities
    type: "Federal Program"
    description: "A federal HUD program providing project-based rental assistance so very low-income adults with disabilities can live independently in the community, often paired with voluntary supportive services."
    link: "https://www.hud.gov/program_offices/comm_planning/section811"

