healthcare:
  - name: NYC Care
    description: "Low-cost/no-cost health services for New Yorkers without health insurance, via NYC Health + Hospitals. Choose your own doctor."
    phone: "1-646-NYC-CARE (1-646-692-2273)"
    address: "Citywide, via NYC Health + Hospitals"
    link: "https://nyccare.nyc"
  - name: "Institute for Family Health - ECHO Free Clinic"
    description: "Free confidential health care for uninsured adults, open Saturday mornings."
    phone: "(347) 854-0170"
    address: "Walton Family Health Center, 1894 Walton Avenue, Bronx, NY 10453"
    link: "https://institute.org"

  - name: "Why Answering 'Yes' to Disability on Medicaid Applications Matters"
    description: "Answering 'yes' when asked about disability on a Medicaid/Marketplace application routes you to the disability-based Medicaid pathway (ABD/non-MAGI), which often has higher income limits and different income-counting rules than standard MAGI Medicaid. Skipping or marking 'no' when a qualifying condition applies can cause you to miss eligibility."
    link: "https://www.healthcare.gov/people-with-disabilities/ssi-and-medicaid"
    secondary_link: "https://www.disabilityrightsca.org/publications/determining-eligibility-under-the-aged-blind-disabled-federal-poverty-level-abd-fpl"

