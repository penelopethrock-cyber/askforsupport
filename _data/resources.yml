  - name: WE NYC (Women Entrepreneurs NYC)
    type: "Entrepreneurship"
    description: "Free business training, mentorship, and networking for women entrepreneurs in NYC."
    link: "https://we.nyc"

technology:
  - name: NYPL TechConnect
    type: "Digital Literacy"
    description: "Free computer classes, digital literacy, Microsoft Office training, and one-on-one tech help at New York Public Library branches citywide."
    address: "Multiple branches; flagship: 455 Fifth Avenue, New York, NY 10016"
    link: "https://nypl.org/techconnect"
  - name: NYC Free Computer Centers
    type: "Free Computer Centers"
    description: "Basic computer classes, tech help, job/resume help, device borrowing, and printing at multiple locations citywide."
    phone: "212-714-8400"
    link: "https://www.nyc.gov/site/oti/residents/computer-centers.page"
  - name: CyPurr Collective
    type: "Digital Security Workshop"
    description: "A Brooklyn-based collective offering free digital security and privacy workshops (cryptoparties) to help community members protect themselves online."
    address: "Brooklyn, NY"
    link: "https://cypurr.nyc"
  - name: Tech Learning Collective
    type: "Digital Security Training"
    description: "A worker-owned NYC cooperative offering hands-on courses in digital security, privacy, and networking, including community-oriented and sliding-scale options."
    address: "New York, NY"
    link: "https://www.techlearningcollective.com"
  - name: "F-Droid"
    type: "Open-Source App Store"
    description: "Free, open-source app store for Android with no tracking, ads, or Google account required, offering 1,200+ vetted apps."
    link: "https://f-droid.org"
  - name: "Briar"
    type: "Encrypted Messaging"
    description: "Peer-to-peer encrypted messaging app with no central server; syncs via the internet (through Tor), Bluetooth, or Wi-Fi, even without internet access."
    link: "https://briarproject.org"
  - name: "IPFS"
    type: "Decentralized Storage"
    description: "The InterPlanetary File System, a peer-to-peer protocol for content-addressed, distributed file storage and sharing across a resilient global network."
    link: "https://ipfs.tech"
  - name: "Nostr"
    type: "Decentralized Social Protocol"
    description: "An open, censorship-resistant protocol for social networking and communication, where no single company or server controls the network."
    link: "https://github.com/nostr-protocol/nostr"
  - name: "Tor Browser"
    type: "Private Browsing"
    description: "Free browser from the nonprofit Tor Project that routes traffic through volunteer relays to protect against tracking, surveillance, and censorship."
    link: "https://www.torproject.org"
  - name: "Homebrew"
    type: "Package Manager"
    description: "Free, open-source package manager for macOS, Linux, and WSL that simplifies installing command-line tools and applications."
    link: "https://brew.sh"
  - name: "Scoop"
    type: "Package Manager"
    description: "Command-line installer for Windows that installs programs to your user folder, no admin permissions or UAC popups required."
    link: "https://scoop.sh"
  - name: "WSL (Windows Subsystem for Linux)"
    type: "Developer Tool"
    description: "Microsoft's built-in feature for running a real Linux environment directly on Windows, without a virtual machine or dual boot."
    link: "https://learn.microsoft.com/en-us/windows/wsl"
  - name: "Chocolatey"
    type: "Package Manager"
    description: "Package manager for Windows, similar to apt-get for Linux, that automates software installation and updates via the command line."
    link: "https://chocolatey.org"
  - name: "Open-Shell"
    type: "System Customization"
    description: "Free, open-source project (successor to Classic Shell) that restores a classic-style Start menu and Explorer toolbar to Windows 10 and 11."
    link: "https://github.com/Open-Shell/Open-Shell-Menu"
  - name: "Microsoft PowerToys"
    type: "System Utility"
    description: "Official set of free, open-source utilities from Microsoft that add productivity tools like window management, a color picker, and batch file renaming to Windows."
    link: "https://learn.microsoft.com/en-us/windows/powertoys"
  - name: "Chris Titus Tech's WinUtil"
    type: "System Utility"
    description: "Free, open-source PowerShell tool for debloating Windows, installing common apps in bulk, applying tweaks, and fixing update issues from one window."
    link: "https://christitus.com/windows-utility-improved"
  - name: "UniGetUI"
    type: "Package Manager GUI"
    description: "Free, open-source graphical interface that unifies WinGet, Scoop, Chocolatey, and other package managers so you can install, update, and remove Windows software with a few clicks instead of the command line."
    link: "https://github.com/marticliment/UniGetUI"
  - name: "Waterfox"
    type: "Web Browser"
    description: "Firefox-based browser that disables telemetry by default and offers privacy-oriented search options; note it is commercially owned, so review its privacy policy if strict privacy is a priority."
    link: "https://www.waterfox.net"
  - name: "LibreWolf"
    type: "Web Browser"
    description: "Privacy- and security-focused fork of Firefox with trackers, telemetry, and data collection disabled by default, plus uBlock Origin built in."
    link: "https://librewolf.net"
  - name: "Brave Browser"
    type: "Web Browser"
    description: "Chromium-based browser with built-in ad and tracker blocking, HTTPS upgrading, and optional private browsing with Tor."
    link: "https://brave.com"
  - name: "Chromium"
    type: "Web Browser"
    description: "The open-source browser project that underlies Chrome, Brave, Edge, and others; lets you run a Google-free base browser build."
    link: "https://www.chromium.org/chromium-projects/"
  - name: "New York Online Divorce (DIY Uncontested Divorce Program)"
    type: "Legal Self-Help Tool"
    description: "Official, free New York State Courts tool (via LawHelp Interactive) that helps generate the paperwork for an uncontested divorce when both spouses agree and there are no children under 21. Papers must still be printed and filed with the court."
    link: "https://www.nycourts.gov/help/diy-forms/uncontested-divorce-program"

housing:
  - name: NYC Housing Connect
    type: "City Program"
    description: "NYC's official portal for applying to affordable housing lotteries across the five boroughs, run by HPD. Create a profile once and apply to multiple listings as they open."
    link: "https://www.nyc.gov/site/hpd/services-and-information/housing-connect.page"
  - name: "Met Council on Housing – Tenants' Rights Hotline"
    type: "Tenant Advocacy"
    description: "Free tenant advocacy hotline open to any tenant living in NYC. Volunteer-staffed, answers questions on repairs, harassment, rent stabilization, evictions, and connects tenants to organizing support and legal referrals."
    phone: "212-979-0611"
    link: "https://www.metcouncilonhousing.org"
  - name: NYC Tenant Helpline (via 311)
    type: "City Program"
    description: "A one-stop city service to inform NYC tenants about their rights and connect them to housing-related resources, including free legal services. Reach it through 311."
    phone: "311"
  - name: HRA Homebase
    type: "Homelessness Prevention"
    description: "NYC's homelessness prevention program, offering case management, help resolving rent arrears, mediation with landlords, and connections to emergency financial assistance to help households stay housed or find new housing before entering shelter."
    phone: "212-361-8000"
    link: "https://www.nyc.gov/site/hra/help/homebase.page"
  - name: Disability Rent Increase Exemption (DRIE)
    type: "Disability Housing Benefit"
    description: "A NYC program that freezes the rent for eligible low-income tenants with disabilities in rent-regulated apartments, exempting them from future rent increases. The landlord receives a property tax credit to offset the frozen rent."
    link: "https://www.nyc.gov/site/rentfreeze/index.page"
  - name: Section 811 Supportive Housing for Persons with Disabilities
    type: "Federal Program"
    description: "A federal HUD program providing project-based rental assistance so very low-income adults with disabilities can live independently in the community, often paired with voluntary supportive services."
    link: "https://www.hud.gov/program_offices/comm_planning/section811"

