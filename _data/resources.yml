  - name: Gay Fight Club
    type: "Self-Defense"
    description: "A queer-focused boxing and fight training community offering classes and a welcoming space for LGBTQ+ people."
    link: "https://www.gayfightclub.com"
  - name: Spectrum Wrestling
    type: "Self-Defense"
    description: "An LGBTQ+-inclusive wrestling club providing training and community in a safe, affirming environment."
  - name: Trans Boxing
    type: "Self-Defense"
    description: "A boxing gym and training program specifically for trans people, offering a supportive and affirming training space."
  - name: Wickwood Aikikia
    type: "Self-Defense"
    description: "An aikido dojo offering LGBTQ+-friendly self-defense training in a welcoming and inclusive environment."
    link: "https://wickwoodaikikia.com"
  - name: Brooklyn Goju
    type: "Self-Defense"
    description: "A goju-ryu karate dojo in Brooklyn offering self-defense training in a community-focused environment."
    link: "https://brooklyngoju.com"
  - name: Center for Anti-Violence Education (CAE)
    type: "Self-Defense"
    description: "Brooklyn-based nonprofit offering self-defense, bystander intervention, and violence prevention training for community members."
    address: "327 Baltic Street, Brooklyn, NY 11201"
    link: "https://caeny.org"
  - name: Muay Sabai
    type: "Self-Defense"
    description: "A muay thai gym offering striking and self-defense training in an inclusive community environment."
    link: "https://www.muaysabai.com"
  - name: Support and Services for Trans and Nonbinary People in New York (LawHelpNY Guide)
    type: "Relocation & Resource Guide"
    description: "A guide for transgender, gender nonconforming, and nonbinary people who are new to New York, with contact info for community centers, health clinics, legal aid organizations, and support groups statewide, plus special sections for youth, elders, disabled people, immigrants, and sex workers."
    link: "https://www.lawhelpny.org/resource/support-and-services-for-trans-and-nonbinary-people-in-new-york"
  - name: Mount Sinai Institute for Advanced Medicine
    type: "Trans Healthcare"
    description: "Comprehensive Health Program offering gender-affirming and transgender medical care alongside HIV specialty and primary care services."
    address: "275 7th Avenue, 12th Floor, New York, NY 10001"
    phone: "212-604-1701"
    link: "https://www.mountsinai.org/locations/institute-advanced-medicine"
  - name: Harlem United
    type: "Community Health Center"
    description: "Community-based health and human services organization offering primary care, dental, counseling, sexual health services, substance use/recovery support, and housing/nutrition programs, with LGBTQ+-affirming care."
    address: "306 Malcolm X Blvd, New York, NY 10027"
    phone: "212-849-2780"
    link: "https://www.harlemunited.org"
  - name: GMHC (Gay Men's Health Crisis)
    type: "HIV/AIDS Services"
    description: "Status-neutral HIV/AIDS services organization offering testing, prevention, mental and behavioral health, substance use services, and dedicated programs for transgender, gender non-conforming, and non-binary people, plus youth and older adults."
    address: "307 West 38th Street, New York, NY 10018"
    phone: "212-367-1000"
    link: "https://gmhc.org"
  - name: Ali Forney Center
    type: "Youth & Housing"
    description: "Dedicated to protecting LGBTQ+ youth (ages 16-24) from homelessness. Providing drop-in services, meals, and emergency housing."
    address: "24-Hour Drop-In: 321 W 125th St, New York, NY 10027"
    phone: "212-206-0574"
    link: "https://www.aliforneycenter.org"
  - name: Breaking Ground
    type: "Housing Services"
    description: "Nonprofit developing and operating supportive and affordable housing for homeless and vulnerable New Yorkers, including people living with HIV/AIDS, mental illness, or physical disabilities."
    address: "505 8th Avenue, 5th Floor, New York, NY 10018"
    phone: "212-389-9300"
    link: "https://www.breakingground.org"
  - name: NYU LGBTQ+ Center
    type: "Community Center"
    description: "Welcoming space for NYU students, faculty, staff, and alums to explore LGBTQ+ community, with lounge space, a lending library, safer-sex supplies, and educational programs and events."
    address: "Kimmel Center for University Life, 60 Washington Square South, Suite 602, New York, NY 10012"
    phone: "212-998-4424"
    link: "https://www.nyu.edu/life/community-flourishing/centers-and-communities/lgbtq-center.html"
  - name: Callen-Lorde Community Health Center
    type: "LGBTQ+ Health Center"
    description: "Provides medical, dental, and behavioral health care to New York's LGBTQ+ community regardless of ability to pay, with locations in Manhattan, Brooklyn, and the Bronx offering primary care, transgender health, HIV treatment/prevention, and more."
    address: "356 West 18th Street, New York, NY 10011 (Chelsea); also Brooklyn and Bronx locations"
    phone: "212-271-7200"
    link: "https://callen-lorde.org"
  - name: NYC Health + Hospitals Pride Center
    type: "Healthcare Provider"
    description: "LGBTQ+ affirming health services at Metropolitan Hospital."
    address: "1901 1st Ave, Manhattan, NY 10029"
    phone: "212-423-7292"
    hours: "Mon-Fri 8:30am-4:30pm"
    link: "https://www.nychealthandhospitals.org"

healthcare:
  - name: NYC Care
    type: "City Program"
    description: "Low-cost/no-cost health services for New Yorkers without health insurance, via NYC Health + Hospitals. Choose your own doctor regardless of immigration status or ability to pay."
    address: "Citywide, via NYC Health + Hospitals"
    phone: "1-646-692-2273"
    link: "https://nyccare.nyc"
  - name: Callen-Lorde Community Health Center
    type: "LGBTQ+ Health"
    description: "Providing high-quality healthcare to LGBTQ+ communities in NYC, regardless of ability to pay."
    address: "Manhattan, Brooklyn, & Bronx"
    link: "https://callen-lorde.org"
  - name: Planned Parenthood of Greater NY
    type: "Reproductive Health"
    description: "Sexual and reproductive healthcare including birth control, STI testing, and screenings."
    address: "Various NYC Locations"
    link: "https://www.plannedparenthood.org/planned-parenthood-greater-new-york"
  - name: NYC Well
    type: "Mental Health"
    description: "Free, confidential mental health support via phone, text, or chat. Available 24/7/365 in 200+ languages."
    phone: "1-888-692-9355"
    link: "https://nycwell.cityofnewyork.us"

education:
  - name: Brooklyn College Adult Literacy Program (BCALP)
    type: "Adult Literacy"
    description: "Free GED/HSE prep and ESOL classes for NY residents 18+, with case management support."
    address: "Brooklyn College, Brooklyn, NY"
    link: "https://brooklyn.edu/literacy"
  - name: CCNY Free GED Preparation Program
    type: "GED Preparation"
    description: "Free GED/HSE prep classes for NY residents 19+, offered through the City College of New York."
    address: "160 Convent Avenue, New York, NY 10031"
    link: "https://www.ccny.cuny.edu/cps/ged-prep"
  - name: NYPL Adult Learning Centers
    type: "Multiple Services"
    description: "Free ESOL, adult literacy, and GED/HSE prep classes across library branches in Manhattan, Bronx, and Staten Island."
    link: "https://www.nypl.org/help/attendance-requirements/adult-learning"
  - name: Brooklyn Public Library Adult Learning
    type: "Multiple Services"
    description: "Free literacy, ESOL, and HSE prep classes for adults 17+ in Brooklyn."
    link: "https://www.bklynlibrary.org/adult-learning"
  - name: Brooklyn Educational Opportunity Center (BEOC)
    type: "Career Training"
    description: "Free vocational training (medical, office, security), GED/HSE prep, and college prep for eligible adults."
    address: "111 Livingston Street, Brooklyn, NY 11201"
