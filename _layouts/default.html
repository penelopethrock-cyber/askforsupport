<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="container header-inner">
      <h1><a href="/">{{ site.title }}</a></h1>
      {% include nav.html %}
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <div class="badge-tray">
    <a href="/contact/" class="copyright-badge-link"><span class="copyright-badge">© penelope throckmorton</span></a>
    <a href="https://github.com/penelopethrock-cyber/askforsupport/blob/main/LICENSE"
       class="license-badge"
       target="_blank"
       rel="noopener"
       aria-label="License: GPLv3"><img src="https://img.shields.io/badge/License-GPLv3-blue.svg" alt="License: GPLv3"></a>
  </div>

  {% unless page.url == "/" %}
  <img src="/assets/images/everett.webp" alt="Everett" style="position: fixed; bottom: 14px; left: 14px; z-index: 150; width: 100px; object-fit: contain; pointer-events: none;">
  {% endunless %}

  <div style="position: fixed; top: 10px; right: 10px; z-index: 9999;">
    <script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script><script type='text/javascript'>kofiwidget2.init('Support me on Ko-fi', '#72a4f2', 'G2G816OFPA');kofiwidget2.draw();</script>
  </div>

  <script src="/assets/js/bg-rain.js"></script>
</body>
</html>
